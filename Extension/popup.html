<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  body {
    width: 340px;
    margin: 0;
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #1f2a24;
    background: #f6f8f6;
  }
  header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    background: #2E8B57;
    color: #fff;
  }
  header .title { flex: 1; font-size: 15px; font-weight: 600; }
  header button {
    border: none;
    background: rgba(255, 255, 255, .18);
    color: #fff;
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .add { display: flex; gap: 8px; padding: 12px 14px 6px; }
  .add input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid #cfd8d2;
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: inherit;
  }
  .add input:focus { outline: 2px solid #2E8B57; outline-offset: -1px; }
  .add button {
    border: none;
    background: #2E8B57;
    color: #fff;
    border-radius: 8px;
    padding: 0 14px;
    font-size: 14px;
    cursor: pointer;
  }
  .add button:disabled { opacity: .6; cursor: default; }
  .status { min-height: 18px; padding: 0 14px; font-size: 12px; color: #6b7a72; }
  .status.ok { color: #2E8B57; }
  .status.err { color: #C0392B; }
  .section {
    padding: 10px 14px 4px;
    font-size: 12px;
    color: #6b7a72;
    border-top: 1px solid #e3e9e5;
    margin-top: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section .title { flex: 1; }
  .section .freshness { color: #9aa8a1; }
  ul { list-style: none; margin: 0; padding: 0 14px 14px; max-height: 300px; overflow-y: auto; }
  li {
    background: #fff;
    border: 1px solid #e3e9e5;
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 8px;
  }
  li .word { font-weight: 600; word-break: break-word; }
  li .trans { margin-top: 2px; font-size: 12px; color: #55635c; word-break: break-word; }
  li.empty { color: #6b7a72; text-align: center; border: none; background: none; padding: 16px 0; }
</style>
</head>
<body>
  <header>
    <span class="title">单词本</span>
    <button id="openOptions">设置</button>
  </header>
  <div class="add">
    <input id="text" type="text" placeholder="输入单词或句子" autocomplete="off">
    <button id="submit">添加</button>
  </div>
  <div id="status" class="status"></div>
  <div class="section"><span class="title">最近添加</span><span class="freshness" id="freshness"></span></div>
  <ul id="list"><li class="empty">加载中…</li></ul>
  <script src="popup.js"></script>
</body>
</html>
